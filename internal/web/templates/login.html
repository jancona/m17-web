{{define "content"}}
<p>Enter the hotspot's admin password.</p>
<form method="post" action="/setup/login">
	<input type="hidden" name="csrf" value="{{.CSRF}}">
	<label for="password">Admin password</label>
	<input id="password" name="password" type="password" autocomplete="current-password" required autofocus
		{{with index .Errors "password"}}aria-invalid="true" aria-describedby="password-err"{{end}}>
	{{with index .Errors "password"}}<p class="error" id="password-err">{{.}}</p>{{end}}
	<div class="actions"><button type="submit">Log in</button></div>
</form>
<p class="hint">Forgot it? Put the SD card in a computer, add <code>dashboard_password=…</code> to <code>m17-config.txt</code> on the boot partition, and restart the hotspot.</p>
{{end}}
